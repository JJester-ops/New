  <script>
    const tl = gsap.timeline({ paused: true });
    const rateEl = document.querySelector("#end-rate-num");
    const rate = { v: 24 };

    tl.fromTo("#end-bg", { backgroundColor: "#faf7f0" }, { backgroundColor: "#b3141b", duration: 0.4, ease: "power2.inOut" }, 0);
    tl.fromTo("#end-part", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.2);
    tl.fromTo("#end-note", { opacity: 0 }, { opacity: 0.85, duration: 0.25, ease: "none" }, 0.45);
    tl.fromTo("#end-rate", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 1.6);
    // 24% rolls down to 0% on "zero"
    tl.fromTo(
      rate,
      { v: 24 },
      {
        v: 0,
        duration: 0.42,
        ease: "none",
        onUpdate: () => {
          rateEl.textContent = String(Math.round(rate.v / 6) * 6);
        },
      },
      2.55,
    );
    tl.fromTo("#end-rate", { color: "#faf7f0" }, { color: "#ffd60a", duration: 0.01 }, 2.97);
    tl.fromTo("#end-rate", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, 2.97);
    window.__timelines["endcard"] = tl;
